<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Escape Tag</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="./style.css?v=2">
</head>
<body>
  <div id="menu" class="screen">
    <div class="panel">
      <h1>Escape Tag</h1>
      <p class="lead">1vs1 脱出鬼ごっこ</p>

      <label>部屋コード</label>
      <div class="room-row">
        <input id="roomId" placeholder="例：ABC12" maxlength="8">
        <button id="randomRoomButton" class="small">作成</button>
      </div>

      <label>役割</label>
      <select id="role">
        <option value="runner">逃走者</option>
        <option value="killer">鬼</option>
      </select>

      <button id="joinButton">部屋に入る</button>

      <div class="note">
        <p>同じ部屋コードで、片方は逃走者、もう片方は鬼で入ってください。</p>
        <p>逃走者：発電機2台修理 → ゲート脱出で勝利</p>
        <p>鬼：逃走者を2回捕獲で勝利</p>
      </div>
    </div>
  </div>

  <div id="gameScreen" class="game-screen hidden">
    <div class="topbar">
      <div>
        <div id="roomLabel" class="room-label">ROOM</div>
        <div id="roleLabel" class="role-label">ROLE</div>
      </div>
      <button id="leaveButton" class="small danger">退出</button>
    </div>

    <canvas id="game" width="360" height="560"></canvas>

    <div class="hud">
      <div id="statusText">待機中...</div>
      <div id="hintText">操作：画面左下スティック / 右下アクション</div>
    </div>

    <div id="joystick" class="joystick">
      <div id="stick" class="stick"></div>
    </div>

    <button id="actionButton" class="action-button">ACTION</button>
  </div>

  <div id="resultOverlay" class="result-overlay hidden">
    <div class="result-box">
      <h2 id="resultTitle">勝敗</h2>
      <p id="resultMessage"></p>
      <button id="restartButton">リスタート</button>
      <button id="backMenuButton" class="sub">メニューへ</button>
    </div>
  </div>

  <script type="module" src="./game.js?v=2"></script>
</body>
</html>
